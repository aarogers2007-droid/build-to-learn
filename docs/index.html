# Glossary — concepts, in plain language

Concepts that started as questions and got answered while building. Each links to the file or commit that taught it. Newest at top.

---

### `rem` + a root `--scale` variable = scale the whole UI with one knob
`px` is an absolute size: 16px is always 16px. `rem` is *relative* to the root (`<html>`) font-size. So if every size in the CSS is written in `rem`, changing one thing — the root font-size — rescales the entire interface proportionally. We drive that root size from a single CSS variable: `html{ font-size: calc(16px * var(--scale)); }`. The text-size control just sets `--scale`, and headings, padding-in-rem, buttons, body text all grow together. If we had left sizes in `px`, the control could only resize the one element it was wired to.
*Taught by:* the app-wide theming port — `reader-mock.html`, `writing-mock.html` (commit with `Learned:` on theming).

### Fail-closed grounding (the anti-hallucination rule, made literal)
The comprehension layer answers **only** from the loaded document. In code this is a lookup against the document's content; when there is no match, it does not improvise a plausible answer — it *refuses* and says the answer is not in the document. "Fail closed" means the safe default on uncertainty is to deny, not to guess. This is what makes the feature trustable and institution-approvable.
*Taught by:* `listen-mock.html` — the `answerQuestion` / `QA` lookup with its no-match fallback.

### CSS custom properties + `data-theme` = themeable surface
Colors are declared once as variables on `:root` (e.g. `--bg`, `--text`). A theme is just a block like `body[data-theme="dark"]{ --bg:#14181b; ... }` that overrides those variables. Flip one attribute on `<body>` and every element that reads `var(--bg)` recolors at once. No per-element restyling. Meaning is never encoded by color alone, so a theme change never removes information.
*Taught by:* every mock's `:root` + `body[data-theme=...]` blocks.

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ startOnLoad:false, theme:'neutral' });
  const esc = (s)=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const mmap = JSON.parse(document.getElementById('mermaidData').textContent || '{}');
  document.querySelectorAll('script[type="text/markdown"]').forEach((s)=>{
    let html = marked.parse(s.textContent.trim());
    for (const [k, code] of Object.entries(mmap)) {
      const pre = '<pre class="mermaid">' + esc(code) + '</pre>';
      html = html.split('<p>@@'+k+'@@</p>').join(pre).split('@@'+k+'@@').join(pre);
    }
    const t = document.querySelector('[data-target="'+s.dataset.target+'"]');
    if (t) t.innerHTML = html;
  });
  try { await mermaid.run({ querySelector: '.mermaid' }); } catch (e) { console.warn('mermaid', e); }
</script>
